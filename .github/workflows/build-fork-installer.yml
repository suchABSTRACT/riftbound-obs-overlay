name: Build installer (fork)

# On every push to the working branch:
#   1. Windows: build riftbound-setup-<version>.exe + portable zip
#   2. Linux:   build the ~1 MB patch zip + update-manifest.json and publish a
#               release with everything, so installed apps show "Update
#               available" and update themselves in place.
# The version is stamped automatically (major.minor from package.json, patch =
# build number), so every push is a newer version the app will pick up.
on:
  push:
    branches:
      - feature/broadcast-overlay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows app + installer
        run: npm run build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/riftbound-setup-${{ needs.version.outputs.version }}.exe
            dist/riftbound-obs-windows.zip
          retention-days: 3

  publish:
    needs: [version, build-windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Patches only carry server/ + public/. If the Electron shell, the updater
      # bootstrap or dependencies changed since the last release, mark this one
      # "full installer" so installed apps fetch the setup instead.
      - name: Decide patch vs full update
        run: |
          git fetch --tags --force
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$PREV" ]; then
            echo "FORCE_FULL=1" >> "$GITHUB_ENV"; echo "No previous release: full"
          elif git diff --name-only "$PREV" HEAD -- electron package-lock.json | grep -q .; then
            echo "FORCE_FULL=1" >> "$GITHUB_ENV"; echo "Shell/deps changed since $PREV: full"
            git diff --name-only "$PREV" HEAD -- electron package-lock.json
          else
            echo "FORCE_FULL=0" >> "$GITHUB_ENV"; echo "Patch is enough since $PREV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Build patch zip + update manifest
        run: |
          npm run build:patch
          # The version stamp makes every lock file look new to installed
          # updaters, which then attempt a native rebuild. Dependency changes
          # ship as full installers (FORCE_FULL), so patches leave the lock out.
          zip -d "dist/riftbound-obs-patch-${VERSION}.zip" package-lock.json || true
          unzip -l "dist/riftbound-obs-patch-${VERSION}.zip" | tail -1
          RELEASE_NOTES="Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" node scripts/generate-manifest.mjs
          ls -la dist

      - name: Publish release
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Riftbound OBS ${VERSION}" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Installed apps update themselves; for a fresh install run riftbound-setup-${VERSION}.exe." \
            "dist/riftbound-setup-${VERSION}.exe" \
            "dist/riftbound-obs-windows.zip" \
            "dist/riftbound-obs-patch-${VERSION}.zip" \
            "dist/update-manifest.json"
